<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radiologist Report Form</title>
  <!-- Bootstrap CSS CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    body, html {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('bg.jpg') no-repeat center center fixed;
      background-size: cover;
    }
    .form-container {
      background: rgba(255, 255, 255, 0.85);
      padding: 30px;
      border-radius: 12px;
      max-width: 400px;
      margin: 40px auto 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    #uploadButton, #recordButton {
      width: 100%;
      margin-bottom: 10px;
    }
    #status {
      margin-top: 10px;
      font-weight: 600;
      color: #333;
      min-height: 1.5em;
    }
    .response-container {
      max-width: 600px;
      margin: 0 auto 40px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    #reportResponse {
      width: 100%;
      height: 200px;
      resize: vertical;
      padding: 10px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-family: monospace, monospace;
      white-space: pre-wrap;
      overflow-y: auto;
      background-color: #f8f9fa;
    }
    .file-info {
      margin-top: 10px;
      font-size: 0.9em;
      color: #666;
    }
    /* فقط جهت نمایش گزارش بر اساس زبان انتخابی */
    .rtl-report {
      direction: rtl;
      unicode-bidi: plaintext;
      text-align: right;
    }
    .ltr-report {
      direction: ltr;
      unicode-bidi: plaintext;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="form-container shadow">
    <h3 class="mb-4 text-center">Radiologist Report</h3>

    <form id="reportForm">
      <!-- انتخاب زبان وویس -->
      <div class="mb-3">
        <label for="languageSelect" class="form-label">Voice Language</label>
        <select class="form-select" id="languageSelect" required>
          <option value="" disabled selected>Select language</option>
          <option value="en">English </option>
          <option value="fa">فارسی </option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label d-block">Upload Voice Report (any audio)</label>
        <input
          type="file"
          id="audioUpload"
          accept="audio/*"
          class="d-none"
        />
        <button type="button" class="btn btn-primary" id="uploadButton">
          Choose File
        </button>
        <div id="fileInfo" class="file-info"></div>
      </div>

      <div class="mb-3">
        <label class="form-label d-block">Or Record Voice Report</label>
        <button type="button" class="btn btn-warning" id="recordButton">
          Start Recording
        </button>
        <div id="recordStatus" class="file-info"></div>
      </div>

      <input type="hidden" name="audioData" id="audioData" />
      <button type="submit" class="btn btn-success w-100" id="submitBtn" disabled>
        Submit Report
      </button>

      <div id="status"></div>
    </form>
  </div>

  <div class="response-container" id="responseContainer" style="display:none;">
    <h5 class="mb-3">Report Response</h5>
    <textarea id="reportResponse" readonly></textarea>
    <button class="btn btn-outline-secondary mt-2" id="copyBtn">
      Copy to Clipboard
    </button>
  </div>

  <!-- Bootstrap JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const uploadButton = document.getElementById('uploadButton');
    const audioUpload = document.getElementById('audioUpload');
    const fileInfo = document.getElementById('fileInfo');
    const recordButton = document.getElementById('recordButton');
    const recordStatus = document.getElementById('recordStatus');
    const audioDataInput = document.getElementById('audioData');
    const submitBtn = document.getElementById('submitBtn');
    const reportForm = document.getElementById('reportForm');
    const responseContainer = document.getElementById('responseContainer');
    const reportResponse = document.getElementById('reportResponse');
    const copyBtn = document.getElementById('copyBtn');
    const statusEl = document.getElementById('status');
    const languageSelect = document.getElementById('languageSelect');

    const BASE_URL = "http://127.0.0.1:5682";

    let mediaRecorder;
    let recordedChunks = [];

    submitBtn.disabled = true;

    uploadButton.addEventListener('click', () => {
      audioUpload.click();
    });

    audioUpload.addEventListener('change', async (e) => {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        alert('Stop recording before uploading a file.');
        audioUpload.value = ''; // reset
        return;
      }

      const file = e.target.files[0];
      if (!file) return;

      const name = (file.name || "").toLowerCase();
      const mime = file.type || "";
      const allowedExt = [".mp3", ".wav", ".ogg", ".m4a", ".webm"];

      const isAudioByMime = mime.startsWith("audio/");
      const isAudioByExt = allowedExt.some(ext => name.endsWith(ext));

      if (!isAudioByMime && !isAudioByExt) {
        alert('Please select an audio file (mp3, wav, ogg, m4a, webm).');
        audioUpload.value = '';
        return;
      }

      recordedChunks = [];
      recordStatus.textContent = '';

      fileInfo.textContent = `Selected: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;

      const reader = new FileReader();
      reader.onload = (event) => {
        audioDataInput.value = event.target.result;
        submitBtn.disabled = false;
      };
      reader.readAsDataURL(file);
    });

    recordButton.addEventListener('click', async () => {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        recordButton.textContent = 'Start Recording';
        recordStatus.textContent = 'Processing recording...';
        audioUpload.disabled = false;
        uploadButton.disabled = false;
      } else {
        // Start recording
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          alert('Your browser does not support audio recording.');
          return;
        }

        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);

          recordedChunks = [];
          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) recordedChunks.push(e.data);
          };

          mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onloadend = () => {
              audioDataInput.value = reader.result;
              submitBtn.disabled = false;
              recordStatus.textContent = `Recording ready (${(blob.size / 1024).toFixed(1)} KB)`;
              fileInfo.textContent = ''; // clear file upload info
            };
            reader.readAsDataURL(blob);
            // Stop all audio tracks to release mic
            stream.getTracks().forEach(track => track.stop());
          };

          mediaRecorder.start();
          recordButton.textContent = 'Stop Recording';
          recordStatus.textContent = 'Recording...';
          audioUpload.value = '';
          audioUpload.disabled = true;
          uploadButton.disabled = true;
          submitBtn.disabled = true; // disable submit until recording stops
        } catch (err) {
          alert('Could not start recording: ' + err.message);
        }
      }
    });

    reportForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!audioDataInput.value) {
        alert('Please upload or record an audio file before submitting.');
        return;
      }

      if (!languageSelect.value) {
        alert('Please select voice language (EN/FA).');
        return;
      }

      submitBtn.disabled = true;
      recordButton.disabled = true;
      uploadButton.disabled = true;
      audioUpload.disabled = true;
      fileInfo.textContent = '';
      recordStatus.textContent = '';
      statusEl.textContent = 'Submitting report...';

      try {
        // Convert base64 audio to Blob
        const audioBlob = dataURLtoBlob(audioDataInput.value);

        const formData = new FormData();
        formData.append('input_voice', audioBlob, 'recording.webm');

        // انتخاب endpoint بر اساس زبان
        let endpoint;
        if (languageSelect.value === 'fa') {
          endpoint = '/api/reports/fa/voice';
        } else {
          endpoint = '/api/voice/gen_report';
        }

        const url = BASE_URL + endpoint;

        const headers = {
          'radio': 'WGhgR5dOAEc34MI0Zpi5C2Y3LyjwT9Ex', // همان API key header
        };

        const response = await fetch(url, {
          method: 'POST',
          headers: headers,
          body: formData
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const resultJson = await response.json();
        const result = resultJson.generated_report;

        reportResponse.value = result;

        // فقط جهت نمایش متن گزارش را بر اساس زبان تنظیم می‌کنیم
        if (languageSelect.value === 'fa') {
          reportResponse.classList.add('rtl-report');
          reportResponse.classList.remove('ltr-report');
        } else {
          reportResponse.classList.add('ltr-report');
          reportResponse.classList.remove('rtl-report');
        }

        responseContainer.style.display = 'block';
        statusEl.textContent = 'Report received successfully!';
      } catch (error) {
        statusEl.textContent = 'Error submitting report: ' + error.message;
        console.error('Error:', error);
        responseContainer.style.display = 'none';
      } finally {
        submitBtn.disabled = false;
        recordButton.disabled = false;
        uploadButton.disabled = false;
        audioUpload.disabled = false;
      }
    });

    copyBtn.addEventListener('click', () => {
      reportResponse.select();
      reportResponse.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(reportResponse.value).then(() => {
        copyBtn.textContent = 'Copied!';
        setTimeout(() => (copyBtn.textContent = 'Copy to Clipboard'), 2000);
      });
    });

    function dataURLtoBlob(dataurl) {
      const arr = dataurl.split(',');
      const mime = arr[0].match(/:(.*?);/)[1];
      const bstr = atob(arr[1]);
      let n = bstr.length;
      const u8arr = new Uint8Array(n);
      while (n--) {
        u8arr[n] = bstr.charCodeAt(n);
      }
      return new Blob([u8arr], { type: mime });
    }
  </script>
</body>
</html>
