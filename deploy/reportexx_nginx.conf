# Nginx site configuration for the Radiology Assistant.
# Adjust the domain, SSL certificate paths, and frontend root before use.
# Enable with:
#   sudo cp deploy/reportexx_nginx.conf /etc/nginx/sites-available/reportexx
#   sudo ln -s /etc/nginx/sites-available/reportexx /etc/nginx/sites-enabled/
#   sudo nginx -s reload

server {
    listen 443 ssl http2;
    server_name reportexx.ir www.reportexx.ir;

    ssl_certificate /etc/letsencrypt/live/reportexx.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reportexx.ir/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Proxy requests starting with /api/ to the FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:5682/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }

    # Serve the frontend
    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name reportexx.ir www.reportexx.ir;
    return 301 https://$host$request_uri;
}
